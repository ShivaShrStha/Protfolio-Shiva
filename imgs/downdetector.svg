<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle Background Telemetry Grid Lines -->
  <g stroke="#1f2937" stroke-width="1" stroke-dasharray="6 6" opacity="0.4">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Central Telemetry Card Container -->
  <rect x="150" y="115" width="900" height="400" rx="20" fill="#111827" stroke="#1f2937" stroke-width="2"/>

  <!-- Window Header Controls -->
  <circle cx="190" cy="155" r="6" fill="#ef4444"/>
  <circle cx="210" cy="155" r="6" fill="#f59e0b"/>
  <circle cx="230" cy="155" r="6" fill="#10b981"/>
  <text x="260" y="159" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" font-weight="500">downdetector.me — live telemetry</text>

  <!-- Live Status Badge Top Right -->
  <g transform="translate(860, 140)">
    <rect width="160" height="32" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <text x="36" y="20" font-family="system-ui, sans-serif" font-size="13" fill="#10b981" font-weight="600">9,636 Monitored</text>
  </g>

  <!-- Main Title -->
  <text x="200" y="240" font-family="system-ui, sans-serif" font-size="42" fill="#ffffff" font-weight="800" letter-spacing="-1">
    Down<tspan fill="#10b981">Detector</tspan>.me
  </text>
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="16" fill="#9ca3af" font-weight="400">
    High-Concurrency Uptime Engine &amp; Programmatic SEO Platform
  </text>

  <!-- Simulated Response Time Sparkline Graph -->
  <g transform="translate(200, 310)">
    <!-- Graph Background Box -->
    <rect width="800" height="110" rx="12" fill="#0a0f1e" stroke="#1f2937" stroke-width="1"/>
    
    <!-- Sparkline Bars -->
    <rect x="30" y="55" width="40" height="35" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="85" y="40" width="40" height="50" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="140" y="45" width="40" height="45" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="195" y="25" width="40" height="65" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="250" y="50" width="40" height="40" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="305" y="30" width="40" height="60" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="360" y="20" width="40" height="70" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="415" y="65" width="40" height="25" rx="4" fill="#ef4444"/> <!-- Simulated latency spike -->
    <rect x="470" y="35" width="40" height="55" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="525" y="40" width="40" height="50" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="580" y="25" width="40" height="65" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="635" y="35" width="40" height="55" rx="4" fill="#10b981" opacity="0.8"/>
    <rect x="690" y="20" width="40" height="70" rx="4" fill="#10b981" opacity="0.9" filter="url(#glow)"/>
    
    <!-- Graph Baseline -->
    <line x1="20" y1="95" x2="780" y2="95" stroke="#374151" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Tech Stack Tag Pills at Bottom of Card -->
  <g transform="translate(200, 450)">
    <rect x="0" y="0" width="85" height="28" rx="6" fill="#1f2937"/>
    <text x="42" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#d1d5db" font-weight="600" text-anchor="middle">PHP 8</text>

    <rect x="95" y="0" width="85" height="28" rx="6" fill="#1f2937"/>
    <text x="137" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#d1d5db" font-weight="600" text-anchor="middle">MySQL</text>

    <rect x="190" y="0" width="105" height="28" rx="6" fill="#1f2937"/>
    <text x="242" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#d1d5db" font-weight="600" text-anchor="middle">cURL Multi</text>

    <rect x="305" y="0" width="95" height="28" rx="6" fill="#1f2937"/>
    <text x="352" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#d1d5db" font-weight="600" text-anchor="middle">pSEO Engine</text>

    <rect x="410" y="0" width="110" height="28" rx="6" fill="#1f2937"/>
    <text x="465" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#d1d5db" font-weight="600" text-anchor="middle">Discord Webhook</text>
  </g>
</svg>
